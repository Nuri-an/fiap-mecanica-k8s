name: Terraform (fiap-mecanica-k8s)

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "**.tf"
      - "modules/**"
      - ".github/workflows/*"
  push:
    branches: ["develop", "main"]
    paths:
      - "**.tf"
      - "modules/**"
      - ".github/workflows/*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-k8s-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

jobs:
  plan-hmg:
    name: Plan Homolog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    environment: Homolog
    env:
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE_HMG || 'fiap-mecanica-k8s-hmg' }}
      TF_VAR_platform_workspace_name: ${{ vars.TF_PLATFORM_WORKSPACE_HMG }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica' }}
      TF_VAR_environment: hmg
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION || '1.31' }}
      TF_VAR_desired_node_count: ${{ vars.DESIRED_NODE_COUNT || '2' }}
      TF_VAR_min_node_count: ${{ vars.MIN_NODE_COUNT || '2' }}
      TF_VAR_max_node_count: ${{ vars.MAX_NODE_COUNT || '4' }}
      TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_api_gateway_stage_name: ${{ vars.API_GATEWAY_STAGE_NAME || '$default' }}
      TF_VAR_tfc_organization: "${{ vars.TF_CLOUD_ORGANIZATION }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color

  plan-prod:
    name: Plan Production
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    environment: Production
    env:
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE_PROD || 'fiap-mecanica-k8s-prod' }}
      TF_VAR_platform_workspace_name: ${{ vars.TF_PLATFORM_WORKSPACE_PROD }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica' }}
      TF_VAR_environment: prod
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION || '1.31' }}
      TF_VAR_desired_node_count: ${{ vars.DESIRED_NODE_COUNT || '2' }}
      TF_VAR_min_node_count: ${{ vars.MIN_NODE_COUNT || '2' }}
      TF_VAR_max_node_count: ${{ vars.MAX_NODE_COUNT || '4' }}
      TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_api_gateway_stage_name: ${{ vars.API_GATEWAY_STAGE_NAME || '$default' }}
      TF_VAR_tfc_organization: "${{ vars.TF_CLOUD_ORGANIZATION }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color

  apply-hmg:
    name: Apply Homolog
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: Homolog
    env:
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE_HMG || 'fiap-mecanica-k8s-hmg' }}
      TF_VAR_platform_workspace_name: ${{ vars.TF_PLATFORM_WORKSPACE_HMG }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica' }}
      TF_VAR_environment: hmg
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION || '1.31' }}
      TF_VAR_desired_node_count: ${{ vars.DESIRED_NODE_COUNT || '2' }}
      TF_VAR_min_node_count: ${{ vars.MIN_NODE_COUNT || '2' }}
      TF_VAR_max_node_count: ${{ vars.MAX_NODE_COUNT || '4' }}
      TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_api_gateway_stage_name: ${{ vars.API_GATEWAY_STAGE_NAME || '$default' }}
      TF_VAR_tfc_organization: "${{ vars.TF_CLOUD_ORGANIZATION }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

  apply-prod:
    name: Apply Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: Production
    env:
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE_PROD || 'fiap-mecanica-k8s-prod' }}
      TF_VAR_platform_workspace_name: ${{ vars.TF_PLATFORM_WORKSPACE_PROD }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'fiap-mecanica' }}
      TF_VAR_environment: prod
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION || '1.31' }}
      TF_VAR_desired_node_count: ${{ vars.DESIRED_NODE_COUNT || '2' }}
      TF_VAR_min_node_count: ${{ vars.MIN_NODE_COUNT || '2' }}
      TF_VAR_max_node_count: ${{ vars.MAX_NODE_COUNT || '4' }}
      TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_api_gateway_stage_name: ${{ vars.API_GATEWAY_STAGE_NAME || '$default' }}
      TF_VAR_tfc_organization: "${{ vars.TF_CLOUD_ORGANIZATION }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

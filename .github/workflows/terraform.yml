name: Terraform (K8s Platform)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: fiap-mecanica
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_auth_lambda_invoke_arn: ${{ vars.AUTH_LAMBDA_INVOKE_ARN || '' }}
  TF_VAR_api_backend_url: ${{ vars.API_BACKEND_URL || '' }}
  TF_VAR_enable_datadog: ${{ vars.ENABLE_DATADOG || 'false' }}
  TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hmg' }}
        run: terraform plan

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        env:
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hmg' }}
        run: terraform apply -auto-approve
